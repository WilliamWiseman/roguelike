<!DOCTYPE html>
<html>
    <head>
        <title>Circle collision!</title>
    </head>
    <body>

        <style>
            html{
                height:100%;
            }
            body{
                height:100%;
                overflow:hidden;
            }
            div{
                position:absolute;
                background-color:red;
                transform: translateX(-50%) translateY(-50%);
                border-radius:50%;
                z-index:2;
            }
            img{
                position:absolute;
                transform: translateX(-50%) translateY(-50%);
                /* border:1px solid red; */
                z-index:2;
            }
            .hud{
                transform: translateX(0) translateY(0);
                position:absolute;
                width:100%;
                height:100%;
                top:0;
                left:0;
                border:0px solid transparent;
                z-index:100;
            }
        </style>
            <img src="https://raw.githubusercontent.com/WilliamWiseman/roguelike/main/images/hud.gif" class="hud" id="hud">
        <script>
            let hud = document.getElementById('hud');
            let screenRatio = 1536 / window.innerWidth;

            function circle(x, y, rad){
                this.x = x;
                this.y = y;
                this.rad = rad;
                return this;
            }

            let mouse = {
                x:0,
                y:0,
                rad:10
            }

            function player(x, y, rad, weapon){
                this.x = x;
                this.y = y;
                this.rad = rad;
                this.weapon = weapon;
                this.momX = 0;
                this.momY = 0;
                this.element = document.createElement('img');
                this.element.src = "https://raw.githubusercontent.com/WilliamWiseman/roguelike/main/images/chest.gif";
                this.element.style.width = `${this.rad * 2 * screenRatio}px`;
                this.element.style.height = `${this.rad * 2 * screenRatio}px`;
                this.element.style.left = `${this.x * screenRatio}px`;
                this.element.style.top = `${this.y * screenRatio}px`;
                document.body.appendChild(this.element);

                player.prototype.move = function(){
                    this.x += this.momX * dt;
                    this.y += this.momY * dt;
                    //position player
                    this.element.style.left = `${this.x * screenRatio}px`;
                    this.element.style.top = `${this.y * screenRatio}px`;
                    
                    if(collision(PLAYER.weapon, mouse)){
                        PLAYER.weapon.currentSpeed = 0;
                        PLAYER.weapon.element.style.left = `${this.weapon.x * screenRatio}px`;
                        PLAYER.weapon.element.style.top = `${this.weapon.y * screenRatio}px`;
                    }else{
                        if(this.weapon.currentSpeed < this.weapon.speed){
                            this.weapon.currentSpeed += Math.ceil(this.weapon.speed * 0.5 * dt);
                        }
                    this.weapon.deg = getAngle(PLAYER.weapon, mouse);
                    this.weapon.element.style.transform = `translateX(-50%) translateY(-50%) rotate(${PLAYER.weapon.deg}deg)`;
                    let ratio = this.weapon.currentSpeed / distance(PLAYER.weapon, mouse);
                    this.weapon.x += ratio * (mouse.x - this.weapon.x) * dt;
                    this.weapon.y += ratio * (mouse.y - this.weapon.y) * dt;
                    PLAYER.weapon.element.style.left = `${this.weapon.x * screenRatio}px`;
                    PLAYER.weapon.element.style.top = `${this.weapon.y * screenRatio}px`;
                }
            }

                player.prototype.atk = function(){
                    this.weapon.attack();
                }

            }

            function wpn(weight, speed, sharpness, sprite){
                this.x = 500;
                this.y = 500;
                this.weight = weight;
                this.speed = speed;
                this.currentSpeed = 0;
                this.element = document.createElement('img');
                this.element.src = sprite;
                this.element.style.width = '30px';
                this.element.style.height = '440px';
                document.body.appendChild(this.element);
                this.deg = 0;
                this.rad = 10;

                wpn.prototype.attack = function(){
                    let ratio = this.speed / distance(PLAYER, mouse);
                }
            }

            let bulletArr = [];
            let enemies = [];

            function distance(a, b){
                return Math.sqrt( (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
            }

            function collision(a, b){
                let dist = distance(a, b);
                return dist < a.rad + b.rad;
            }

            function point(a, b){
                let deg = getAngle(a, b);
                a.element.style.transform = `translateX(-50%) translateY(-50%) rotate(${deg}deg)`;
            }

            function getAngle(a, b){
                return Math.atan2(b.y - a.y, b.x - a.x) * (180 / Math.PI) + 90;
            }

            function enemy(x, y, speed, radius, hp, sprite){
                this.x = x;
                this.y = y;
                this.height = radius * 2;
                this.width = radius * 2;
                this.rad = Math.ciel(radius * 1.3);
                this.sprite = sprite;
                this.element = document.createElement('img');
                this.element.style = `width:${this.width * screenRatio}px;height:${this.height * screenRatio}`;
                    this.element.style.left = `${this.x * screenRatio}px`;
                    this.element.style.top = `${this.y * screenRatio}px`;
                    this.element.src = this.sprite;
                document.body.appendChild(this.element);

                enemy.prototype.seek = function(){

                    //this.weapon.x += ratio * (mouse.x - this.weapon.x) * dt;

                    let ratio = distance(this, PLAYER);
                    this.x += ratio * (PLAYER.x - this.x) * dt;
                    this.y += ratio * (PLAYER.y - this.y) * dt;
                    this.element.style.left = `${this.x * screenRatio}px`;
                    this.element.style.top = `${this.y * screenRatio}px`;
                }
            }

            function slime(x, y){
                this = new enemy(x, y, 500, 15, 50, 'images/slime.gif');
                this.element.style.opacity = '0.7';
                
                slime.prototype.think = function(){
                    this.seek();
                }
            }

            let enemyArr = [];

            let PLAYER = new player(100, 100, 40, new wpn(1, 1100, 1, 'https://raw.githubusercontent.com/WilliamWiseman/roguelike/main/images/spear.gif'));

            enemyArr.push(new slime(800, 100));

            document.addEventListener("keydown", function (event) {
            event.preventDefault();
            let key = event.key;
            key = key.toLowerCase();
            switch (key) {
                case "a":
                    PLAYER.momX = -300;
                    break;
                case "d":
                    PLAYER.momX = 300;
                    break;
                case "w":
                    PLAYER.momY = -300;
                    break;
                case "s":
                    PLAYER.momY = 300;
                    break;
            }
        });

        document.addEventListener("keyup", function (event) {
            event.preventDefault();
            let key = event.key;
            key = key.toLowerCase();
            switch (key) {
                case "a":
                    if (PLAYER.momX < 0) {
                        PLAYER.momX = 0;
                    }
                    break;
                case "d":
                    if (PLAYER.momX > 0) {
                        PLAYER.momX = 0;
                    }
                    break;
                case "w":
                    if (PLAYER.momY < 0) {
                        PLAYER.momY = 0;
                    }
                    break;
                case "s":
                    if (PLAYER.momY > 0) {
                        PLAYER.momY = 0;
                    }
                    break;
            }
        });

            hud.addEventListener('mousemove', (event) => {
                mouse.x = Math.floor(event.offsetX / screenRatio);
                mouse.y = Math.floor(event.offsetY / screenRatio);
                PLAYER.weapon.deg = getAngle(PLAYER.weapon, mouse);
                PLAYER.weapon.element.style.transform = `translateX(-50%) translateY(-50%) rotate(${PLAYER.weapon.deg}deg)`;
            });

            hud.addEventListener('mousedown', (event) => {
                PLAYER.atk();

            });

            let lastTime = performance.now();
            let dt;

        function gameLoop(now){
            dt = (now - lastTime) / 1000;
            
            dt = Math.min(dt, 0.5);

                    let newArr = [];

                    PLAYER.move();

                for(let i = 0; i < bulletArr.length; i++){
                    bulletArr[i].move();
                    if(bulletArr[i].active){
                        newArr.push(bulletArr[i]);
                    }
                }
                for(let i = 0; i < enemyArr.length; i++){
                    enemyArr[i].think();
                }
                    bulletArr = newArr;

            lastTime = now;
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

        </script>
    </body>
</html>
